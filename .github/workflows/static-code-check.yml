name: Static Code Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-code:

    name: "Static Code Check"
    runs-on: "ubuntu-24.04"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install prek
        run: python -m pip install prek
      - name: Run prek
        run: prek run --all-files --show-diff-on-failure
